<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Dimyati Nur Achmad</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ======= GLOBAL ======= */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Poppins', sans-serif; 
      background: linear-gradient(160deg, #0f0f0f, #1a1a1a); 
      color: #fff; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      flex-direction: column; 
      text-align: center; 
      padding: 20px; 
      overflow: hidden;
      position: relative;
    }

    h1 { color: #ffcc70; margin-bottom: 15px; font-size: 2.5rem; }
    p { color: #ccc; font-size: 1.2rem; margin-bottom: 300px; max-width: 600px; }

    button {
      background: linear-gradient(45deg, #ffcc70, #ff8c42);
      color: #0f0f0f;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      border-radius: 12px;
      cursor: pointer;
      position: absolute;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(255,204,112,0.5);
    }
    button:hover { transform: scale(1.08); }
    button:active { transform: scale(0.98); }

    /* MODAL CUSTOM */
    #customAlert {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #ffcc70;
      color: #0f0f0f;
      padding: 25px 40px;
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      font-size: 1.2rem;
      z-index: 9999;
      text-align: center;
      animation: fadeIn 0.3s ease forwards;
    }

    @keyframes fadeIn {
      from {opacity:0; transform: translate(-50%, -60%);}
      to {opacity:1; transform: translate(-50%, -50%);}
    }
  </style>
</head>
<body>

      <!-- NAVIGATION -->
  <nav class="contact-nav">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="page-profile.html">Bio</a></li>
      <li><a href="page-gallery.html" class="active">Gallery</a></li>
      <li><a href="page-blog.html">Blog</a></li>
      <li><a href="page-contact.html">Contact</a></li>
    </ul>
  </nav>

<div class="oops">
  <h1>Oops! 😅</h1>
  <p>Maaf, tidak ada momen bahagia atau konten yang bisa ditampilkan 😜</p>
</div>

<button id="moreInfoBtn">More Info</button>

<!-- MODAL CUSTOM -->
<div id="customAlert">udah woyy!! nanti rusak website aing 🗿</div>

<script>
  const btn = document.getElementById("moreInfoBtn");
  const alertBox = document.getElementById("customAlert");
  let clickCount = 0;

  // Inisialisasi posisi awal tombol di tengah layar (sedikit di bawah untuk navbar)
  const setInitialPosition = () => {
    const x = window.innerWidth / 2 - btn.offsetWidth / 2;
    const y = window.innerHeight / 2 - btn.offsetHeight / 2 + 50; // geser sedikit ke bawah
    btn.style.left = x + "px";
    btn.style.top = y + "px";
  };
  setInitialPosition();

  // Fungsi untuk memindahkan tombol ke posisi random, tapi tidak terlalu atas
  const moveButtonRandom = () => {
    const maxX = window.innerWidth - btn.offsetWidth - 20;
    const maxY = window.innerHeight - btn.offsetHeight - 20;
    const minY = 100; // minimal jarak dari atas agar tidak menabrak navbar

    const randomX = Math.floor(Math.random() * maxX);
    const randomY = Math.floor(Math.random() * (maxY - minY)) + minY;

    btn.style.left = randomX + "px";
    btn.style.top = randomY + "px";
  };

  // Fungsi menampilkan modal custom
  const showCustomAlert = () => {
    btn.style.display = "none"; // sembunyikan tombol
    alertBox.style.display = "block"; // tampilkan modal

    setTimeout(() => {
      alertBox.style.display = "none"; // hilangkan modal
      btn.style.display = "block"; // tampilkan tombol lagi
    }, 5000); // durasi 5 detik
  };

  // Tombol lari-lari saat kursor mendekat
  // btn.addEventListener("mouseenter", () => {
  //   moveButtonRandom();
  // });

  // Tombol pindah saat diklik + hitung klik
  btn.addEventListener("click", (e) => {
    e.preventDefault();
    clickCount++;
    moveButtonRandom();

    if (clickCount >= 5) {
      showCustomAlert();
    }
  });

  // Update posisi tombol jika window di resize
  window.addEventListener("resize", setInitialPosition);
</script>

</body>
</html>
