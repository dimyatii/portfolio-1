<style>
/* === THEME DARK MODERN RESPONSIVE === */
body {
  margin: 0;
  font-family: "Poppins", sans-serif;
  background: radial-gradient(circle at top, #0d0d0d, #111);
  color: #f1f1f1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 150px;
  transition: background 0.5s;
}

header { text-align: center; padding: 2rem 1rem 1rem; }
header h1 { font-size: 2rem; color: #a78bfa; margin-bottom: 0.3rem; text-shadow: 0 0 10px #a78bfa44; }
header p { color: #ccc; font-size: 0.95rem; }

main { width: 90%; max-width: 700px; }

.form-container {
  background: #181818;
  border-radius: 15px;
  padding: 1.5rem;
  box-shadow: 0 8px 20px rgba(0,0,0,0.5);
  margin-bottom: 2rem;
  position: relative;
  transition: transform 0.2s, box-shadow 0.2s;
}
.form-container:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 25px rgba(0,0,0,0.6);
}

label { display: block; margin-top: 1rem; color: #bbb; }

input, textarea {
  width: 98%;
  background: #2a2a2a;
  border: none;
  border-radius: 8px;
  color: #fff;
  padding: 0.8rem;
  font-size: 1rem;
  outline: none;
  margin-top: 0.5rem;
  transition: background 0.2s, box-shadow 0.2s, transform 0.2s;
}
input:focus, textarea:focus {
  background: #333;
  box-shadow: 0 0 10px #8b5cf6aa;
  transform: scale(1.02);
}

/* Tombol kirim */
button {
  background: linear-gradient(135deg, #8b5cf6, #6366f1);
  color: white;
  border: none;
  padding: 0.8rem 1.6rem;
  border-radius: 10px;
  cursor: pointer;
  font-size: 1.1rem;
  margin-top: 1.2rem;
  transition: transform 0.3s, box-shadow 0.3s;
}
button:hover { transform: scale(1.08); box-shadow: 0 0 20px #8b5cf6aa; }
button:active { transform: scale(0.95); }

/* Loader */
.loader {
  display: none;
  width: 40px;
  height: 40px;
  border: 4px solid #a78bfa;
  border-top: 4px solid transparent;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 1rem auto;
}
@keyframes spin { from {transform: rotate(0deg);} to {transform: rotate(360deg);} }

/* Notifikasi */
.notif {
  display: none;
  text-align: center;
  margin-top: 1rem;
  padding: 0.8rem;
  border-radius: 8px;
  font-size: 0.95rem;
  transition: opacity 0.3s, transform 0.3s;
}
.notif.success { background: #22c55e33; color: #4ade80; }
.notif.error { background: #ef444433; color: #f87171; }

#messagesList {
  display: flex;
  flex-direction: column-reverse;
  gap: 1rem;
  margin-bottom: 2rem;
}

/* Gaya tiap pesan */
.message {
  background: #1f1f1f;
  border-left: 5px solid #8b5cf6;
  border-radius: 12px;
  padding: 1rem;
  box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  animation: fadeIn 0.5s ease;
  transition: transform 0.3s, box-shadow 0.3s;
}
.message.new { animation: bounceGlow 2s ease; }
.message:hover { transform: translateX(3px); box-shadow: 0 6px 18px rgba(139,92,246,0.5); }

.message h3 { margin: 0; color: #a78bfa; }
.message p { margin-top: 0.4rem; color: #ddd; white-space: pre-wrap; }

/* Efek teks dicoret otomatis */
.message.strike p {
  text-decoration: line-through;
  opacity: 0.5;
  color: #fdfdfd;
}

small { display:block; color:#777; margin-top:0.5rem; font-size:0.8rem; text-align:right; }

footer { padding: 1rem; color: #555; text-align: center; font-size: 0.8rem; }

@keyframes fadeIn { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
@keyframes bounceGlow {
  0% { transform: scale(0.9); box-shadow:0 0 0px #ffffffaa; }
  50% { transform: scale(1.05); box-shadow:0 0 10px #ffffffaa; }
  70% { transform: scale(0.98); }
  100% { transform: scale(1); box-shadow:0 0 0px #ffffffaa; }
}

@media(max-width:480px){
  header h1 { font-size:1.5rem; }
  input, textarea, button { font-size:0.95rem; }
  .form-container { padding:1rem; }
}
</style>

<header>
  <h1>💭 Random Teks Anonim</h1>
  <p>Tulis curhatanmu secara anonim — Buat tag nama kasih clue dong 😆</p>
</header>

<main>
  <div class="form-container">
    <label for="name">Nama (opsional):</label>
    <input type="text" id="name" placeholder="Contoh: Bocah hilang">

    <label for="message">Curhatanmu:</label>
    <textarea id="message" rows="4" placeholder="Tulis sesuatu di sini..."></textarea>

    <button id="sendBtn">Kirim 🚀</button>
    <div class="loader" id="loader"></div>
    <div class="notif" id="notif"></div>
  </div>

  <div id="messagesList"></div>
</main>

<footer>© 2025 Dimyati Nur Achmad — Kirim aja, kadang nulis itu bentuk healing juga ✨</footer>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
// === Firebase Config ===
const firebaseConfig = {
  apiKey: "AIzaSyA9Jx4irqQtIMkFlPEt5YgfMPtz4gu1ssE",
  authDomain: "random-teks-anonim.firebaseapp.com",
  databaseURL: "https://random-teks-anonim-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "random-teks-anonim",
  storageBucket: "random-teks-anonim.firebasestorage.app",
  messagingSenderId: "123003572259",
  appId: "1:123003572259:web:3d0cb4ac2adef905846196",
  measurementId: "G-E845G29V86"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const sendBtn=document.getElementById("sendBtn");
const nameInput=document.getElementById("name");
const messageInput=document.getElementById("message");
const loader=document.getElementById("loader");
const notif=document.getElementById("notif");
const messagesList=document.getElementById("messagesList");

// 🎨 Palet warna random
const colorPalette = [
  "#8b5cf6","#6366f1","#ec4899","#10b981","#f59e0b",
  "#3b82f6","#14b8a6","#a855f7","#f43f5e","#22c55e"
];

let lastColor = null;
// 🔁 Pilih warna acak tapi tidak boleh sama dengan sebelumnya
function getRandomColor() {
  let color;
  do {
    color = colorPalette[Math.floor(Math.random() * colorPalette.length)];
  } while (color === lastColor);
  lastColor = color;
  return color;
}

// 🚫 Kata terlarang — otomatis dicoret
const bannedWords = ["jokowi","prabowo","megawati","bahlil","anies","ganjar","mahfud","sandiaga"];

// === KIRIM PESAN ===
sendBtn.addEventListener("click", ()=>{
  const name=nameInput.value.trim()||"Anonim 🤫";
  const message=messageInput.value.trim();
  if(!message){showNotif("Curhatanmu jangan kosong 😅","error");return;}
  
  loader.style.display="block"; sendBtn.disabled=true;
  db.ref("curhatan").push({
    name,
    message,
    time:new Date().toLocaleString(),
    color:getRandomColor() // simpan warna acak ke database
  })
  .then(()=>{
    loader.style.display="none"; sendBtn.disabled=false; messageInput.value="";
    showNotif("Curhatan berhasil dikirim 💌","success");
    fireConfetti(); // 🎊 Efek confetti 2 detik
  })
  .catch(err=>{
    loader.style.display="none"; sendBtn.disabled=false;
    showNotif("Gagal mengirim: "+err.message,"error");
  });
});

// === NOTIFIKASI ===
function showNotif(text,type){
  notif.innerText=text; notif.className="notif "+type;
  notif.style.display="block"; notif.style.opacity=1;
  setTimeout(()=>{ notif.style.opacity=0; setTimeout(()=>notif.style.display="none",500); },3000);
}

// === REAL-TIME MESSAGES ===
db.ref("curhatan").on("value",snapshot=>{
  const data=snapshot.val(); messagesList.innerHTML="";
  if(data){
    Object.keys(data).forEach(id=>{
      const msg=data[id];
      const div=document.createElement("div");
      div.classList.add("message","new");

      // 🟣 Warna acak dari database (agar tetap konsisten)
      const color = msg.color || getRandomColor();
      div.style.borderLeft = `5px solid ${color}`;
      div.style.boxShadow = `0 4px 5px ${color}55`;

      // 🚫 Cek apakah mengandung kata terlarang
      const lowerMsg = msg.message.toLowerCase();
      const hasBanned = bannedWords.some(word => lowerMsg.includes(word));
      if (hasBanned) div.classList.add("strike");

      div.innerHTML=`<h3 style="color:${color}">${msg.name}</h3>
                     <p>${msg.message}</p>
                     <small>${msg.time}</small>`;
      messagesList.appendChild(div);
      setTimeout(()=>div.classList.remove("new"),2000);
    });
  }else{
    messagesList.innerHTML="<p style='text-align:center;color:#777;'>Belum ada curhatan 😴</p>";
  }
});

// 🎉 Efek confetti (2 detik)
function fireConfetti(){
  const canvas=document.createElement("canvas");
  canvas.style.position="fixed"; canvas.style.top=0; canvas.style.left=0;
  canvas.style.width="100%"; canvas.style.height="100%"; canvas.style.pointerEvents="none";
  document.body.appendChild(canvas);
  const ctx=canvas.getContext("2d");
  const w=canvas.width=window.innerWidth;
  const h=canvas.height=window.innerHeight;
  const pieces=[];
  for(let i=0;i<150;i++){
    pieces.push({x:Math.random()*w,y:Math.random()*h,dx:(Math.random()-0.5)*6,dy:(Math.random()-0.5)*6,color:`hsl(${Math.random()*360},100%,70%)`});
  }
  let count=0;
  function anim(){
    ctx.clearRect(0,0,w,h);
    pieces.forEach(p=>{
      p.x+=p.dx; p.y+=p.dy;
      ctx.fillStyle=p.color; ctx.fillRect(p.x,p.y,6,6);
    });
    count++; if(count<120) requestAnimationFrame(anim); else canvas.remove();
  }
  anim();
}


// Toggle hamburger menu
const hamburger = document.querySelector('.hamburger');
const navLinks = document.querySelector('.nav-links');

function openMenu(){
  navLinks.classList.add('show');
  document.body.classList.add('menu-open');
}

function closeMenu(){
  navLinks.classList.remove('show');
  document.body.classList.remove('menu-open');
}

hamburger.addEventListener('click', ()=>{
  if(navLinks.classList.contains('show')){
    closeMenu();
  }else{
    openMenu();
  }
});

// Tutup menu jika klik area luar
document.body.addEventListener('click', (e)=>{
  if(navLinks.classList.contains('show') && !navLinks.contains(e.target) && !hamburger.contains(e.target)){
    closeMenu();
  }
});



</script>
</body>
